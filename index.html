<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#170d22">
  <title>ステラペットマルシェ｜ハロウィンARカメラ</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
    button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
    #app{position:fixed;inset:0;overflow:hidden;background:#000}
    #camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
    #frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none;z-index:2}
    #controls{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));z-index:4;display:flex;justify-content:center;align-items:center;gap:28px}
    #controls[hidden]{display:none}.roundButton{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(20,20,20,.7);font-size:25px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
    #shutterButton{width:80px;height:80px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.55);box-shadow:0 0 0 4px rgba(0,0,0,.58),0 5px 18px rgba(0,0,0,.4)}
    button:active{transform:scale(.96)}
    #messageBar{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;z-index:5;max-width:90%;padding:9px 14px;border-radius:999px;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.58);font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
    #messageBar.show{opacity:1}
    .screen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));color:#fff;text-align:center;background:radial-gradient(circle at 50% 20%,rgba(255,142,20,.26),transparent 35%),linear-gradient(160deg,rgba(54,20,75,.97),rgba(15,7,24,.98))}
    .panel{width:min(100%,420px);padding:28px 22px;border:1px solid rgba(255,255,255,.18);border-radius:24px;background:rgba(255,255,255,.08);box-shadow:0 18px 60px rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .panel h1{margin:0 0 12px;font-size:clamp(25px,7vw,36px);line-height:1.35}.panel p{margin:0 0 20px;font-size:15px;line-height:1.75}
    .mainButton,.subButton{width:100%;border-radius:999px;font-weight:800}.mainButton{min-height:54px;padding:14px 20px;color:#fff;background:#ff8a00;font-size:17px;box-shadow:0 7px 22px rgba(0,0,0,.28)}
    .subButton{min-height:49px;margin-top:12px;padding:12px 18px;color:#2b1838;background:#fff;font-size:15px}
    #permissionStatus{min-height:24px;margin-top:16px;color:#ffe0b4;font-size:14px;line-height:1.6;white-space:pre-line}
    #settingsGuide{display:none;margin-top:18px;padding:16px;border-radius:16px;color:#fff;background:rgba(0,0,0,.26);font-size:13px;line-height:1.7;text-align:left}#settingsGuide strong{color:#ffd27a}
    #previewScreen{z-index:20;display:none;flex-direction:column;background:rgba(0,0,0,.94)}#previewImage{display:block;max-width:100%;max-height:calc(100% - 100px);object-fit:contain;border-radius:14px}
    #previewActions{display:flex;gap:12px;margin-top:16px}#saveButton,#retakeButton{padding:13px 20px;border-radius:999px;font-size:16px;font-weight:800}#saveButton{color:#fff;background:#ff8a00}#retakeButton{color:#222;background:#fff}canvas{display:none}
  </style>
</head>
<body>
  <main id="app">
    <video id="camera" autoplay muted playsinline></video>
    <img id="frame" src="frame.png" alt="ステラペットマルシェ限定フレーム">
    <div id="messageBar"></div>
    <div id="controls" hidden>
      <button id="switchCameraButton" class="roundButton" type="button" aria-label="前後のカメラを切り替える">↻</button>
      <button id="shutterButton" type="button" aria-label="写真を撮影する"></button>
      <button id="helpButton" class="roundButton" type="button" aria-label="使い方を見る">?</button>
    </div>
    <section id="permissionScreen" class="screen">
      <div class="panel">
        <h1>🎃 ハロウィン限定<br>ARカメラ</h1>
        <p>カメラの使用を許可すると、<br>限定フレームを重ねて撮影できます。</p>
        <button id="startButton" class="mainButton" type="button">カメラを許可して撮影する</button>
        <button id="retryButton" class="subButton" type="button" hidden>設定変更後にもう一度確認</button>
        <div id="permissionStatus">カメラの許可状態を確認しています…</div>
        <div id="settingsGuide">
          <strong>カメラが「拒否」になっている場合</strong><br>
          ブラウザのアドレス欄付近にある鍵・設定アイコンから、このサイトの「カメラ」を<strong>許可</strong>へ変更してください。<br><br>
          <strong>iPhone（Safari）</strong><br>アドレス欄の「ぁあ」→「Webサイトの設定」→「カメラ」→「許可」<br><br>
          <strong>Android（Chrome）</strong><br>アドレス欄左の設定アイコン→「権限」→「カメラ」→「許可」<br><br>
          変更後、この画面の「設定変更後にもう一度確認」を押してください。
        </div>
      </div>
    </section>
    <section id="previewScreen" class="screen">
      <img id="previewImage" alt="撮影した写真">
      <div id="previewActions"><button id="saveButton" type="button">写真を保存</button><button id="retakeButton" type="button">撮り直す</button></div>
    </section>
    <canvas id="photoCanvas"></canvas>
  </main>
  <script>
    "use strict";
    const video=document.getElementById("camera"),frame=document.getElementById("frame"),controls=document.getElementById("controls"),permissionScreen=document.getElementById("permissionScreen"),permissionStatus=document.getElementById("permissionStatus"),settingsGuide=document.getElementById("settingsGuide"),startButton=document.getElementById("startButton"),retryButton=document.getElementById("retryButton"),switchCameraButton=document.getElementById("switchCameraButton"),shutterButton=document.getElementById("shutterButton"),helpButton=document.getElementById("helpButton"),messageBar=document.getElementById("messageBar"),previewScreen=document.getElementById("previewScreen"),previewImage=document.getElementById("previewImage"),saveButton=document.getElementById("saveButton"),retakeButton=document.getElementById("retakeButton"),canvas=document.getElementById("photoCanvas");
    let stream=null,facingMode="environment",capturedPhoto="",permissionWatcher=null,isStarting=false;
    function showMessage(text,duration=2200){messageBar.textContent=text;messageBar.classList.add("show");clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>messageBar.classList.remove("show"),duration)}
    function stopCamera(){if(!stream)return;stream.getTracks().forEach(track=>track.stop());stream=null;video.srcObject=null}
    function setLoadingState(v){isStarting=v;startButton.disabled=v;retryButton.disabled=v;startButton.textContent=v?"カメラを起動しています…":"カメラを許可して撮影する";retryButton.textContent=v?"確認しています…":"設定変更後にもう一度確認"}
    function showPermissionDenied(){permissionStatus.textContent="カメラが拒否されています。\nブラウザの設定で「許可」に変更してください。";settingsGuide.style.display="block";retryButton.hidden=false;startButton.hidden=true}
    function showPermissionPrompt(){permissionStatus.textContent="ボタンを押すと、ブラウザのカメラ許可画面が表示されます。";settingsGuide.style.display="none";retryButton.hidden=true;startButton.hidden=false}
    function showPermissionGranted(){permissionStatus.textContent="カメラは許可されています。起動しています…";settingsGuide.style.display="none";retryButton.hidden=true;startButton.hidden=false}
    function updateMirror(){video.style.transform=facingMode==="user"?"scaleX(-1)":"none"}
    async function requestCamera(){if(isStarting)return;setLoadingState(true);permissionStatus.textContent="カメラへのアクセスを確認しています…";try{if(!window.isSecureContext)throw new Error("INSECURE_CONTEXT");if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("UNSUPPORTED_BROWSER");stopCamera();stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facingMode},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();updateMirror();permissionScreen.style.display="none";controls.hidden=false;showMessage("中央の白いボタンで撮影できます")}catch(error){console.error(error);const denied=error.name==="NotAllowedError"||error.name==="PermissionDeniedError";if(denied)showPermissionDenied();else if(error.message==="INSECURE_CONTEXT")permissionStatus.textContent="カメラはHTTPSのページでのみ利用できます。\nGitHub Pagesの公開URLから開いてください。";else if(error.message==="UNSUPPORTED_BROWSER")permissionStatus.textContent="このブラウザではカメラを利用できません。\nSafariまたはChromeで開いてください。";else if(error.name==="NotFoundError")permissionStatus.textContent="利用できるカメラが見つかりませんでした。";else if(error.name==="NotReadableError")permissionStatus.textContent="カメラを使用できません。\n他のカメラアプリを閉じて、もう一度お試しください。";else{permissionStatus.textContent="カメラを起動できませんでした。\nブラウザを再読み込みして、もう一度お試しください。";retryButton.hidden=false}}finally{setLoadingState(false)}}
    async function checkCameraPermission(){if(!navigator.permissions||!navigator.permissions.query){showPermissionPrompt();return"unknown"}try{const status=await navigator.permissions.query({name:"camera"});if(permissionWatcher)permissionWatcher.onchange=null;permissionWatcher=status;status.onchange=async()=>{await applyPermissionState(status.state);if(status.state==="granted"&&!stream)await requestCamera()};await applyPermissionState(status.state);return status.state}catch{showPermissionPrompt();return"unknown"}}
    async function applyPermissionState(state){if(state==="granted")showPermissionGranted();else if(state==="denied")showPermissionDenied();else showPermissionPrompt()}
    async function initializeCameraFlow(){const state=await checkCameraPermission();if(state==="granted"||state==="prompt"||state==="unknown")await requestCamera()}
    async function switchCamera(){facingMode=facingMode==="environment"?"user":"environment";await requestCamera()}
    function getCoverCrop(sw,sh,tw,th){const sr=sw/sh,tr=tw/th;let sx=0,sy=0,w=sw,h=sh;if(sr>tr){w=sh*tr;sx=(sw-w)/2}else{h=sw/tr;sy=(sh-h)/2}return{sx,sy,sw:w,sh:h}}
    function takePhoto(){if(!video.videoWidth||!video.videoHeight){showMessage("カメラの準備ができていません");return}if(!frame.complete||frame.naturalWidth===0){showMessage("frame.pngを読み込めませんでした");return}const outputWidth=1080,outputHeight=1920,context=canvas.getContext("2d");canvas.width=outputWidth;canvas.height=outputHeight;context.clearRect(0,0,outputWidth,outputHeight);const crop=getCoverCrop(video.videoWidth,video.videoHeight,outputWidth,outputHeight);context.save();if(facingMode==="user"){context.translate(outputWidth,0);context.scale(-1,1)}context.drawImage(video,crop.sx,crop.sy,crop.sw,crop.sh,0,0,outputWidth,outputHeight);context.restore();context.drawImage(frame,0,0,outputWidth,outputHeight);capturedPhoto=canvas.toDataURL("image/jpeg",.94);previewImage.src=capturedPhoto;previewScreen.style.display="flex"}
    function savePhoto(){if(!capturedPhoto)return;const link=document.createElement("a"),timestamp=new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);link.href=capturedPhoto;link.download=`stellar-pet-marche-halloween-${timestamp}.jpg`;document.body.appendChild(link);link.click();link.remove();showMessage("写真を保存しました")}
    function retakePhoto(){previewScreen.style.display="none";previewImage.removeAttribute("src");capturedPhoto=""}
    function showHelp(){alert("使い方\n\n1. カメラの使用を『許可』します。\n2. ワンちゃんを中央に合わせます。\n3. 白い丸ボタンで撮影します。\n4. 『写真を保存』を押します。\n5. 保存した写真をInstagramへ投稿してください。")}
    startButton.addEventListener("click",requestCamera);retryButton.addEventListener("click",async()=>{const state=await checkCameraPermission();if(state==="denied"){showPermissionDenied();return}await requestCamera()});switchCameraButton.addEventListener("click",switchCamera);shutterButton.addEventListener("click",takePhoto);saveButton.addEventListener("click",savePhoto);retakeButton.addEventListener("click",retakePhoto);helpButton.addEventListener("click",showHelp);window.addEventListener("pagehide",stopCamera);
    document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&permissionScreen.style.display!=="none"){const state=await checkCameraPermission();if(state==="granted")await requestCamera()}});
    window.addEventListener("DOMContentLoaded",initializeCameraFlow);
  </script>
</body>
</html>
