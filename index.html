<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <title>ステラペットマルシェ｜ハロウィン限定フレーム</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family:
        -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Yu Gothic", Meiryo, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    /* カメラ映像 */
    #camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /* フレーム画像 */
    #frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }

    /* 操作ボタン */
    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      z-index: 4;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    .round-button {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.72);
      color: #fff;
      font-size: 24px;
      display: grid;
      place-items: center;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    #shutter {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: #fff;
      border: 6px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.55),
        0 4px 16px rgba(0, 0, 0, 0.35);
    }

    #shutter:active,
    .round-button:active,
    #startButton:active,
    #downloadButton:active,
    #closePreview:active {
      transform: scale(0.96);
    }

    /* 最初の案内画面 */
    #permissionScreen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      color: #fff;
      text-align: center;
      background:
        linear-gradient(rgba(25, 10, 35, 0.78), rgba(15, 5, 25, 0.9));
    }

    #permissionScreen h1 {
      margin: 0 0 14px;
      font-size: clamp(24px, 7vw, 38px);
      line-height: 1.35;
    }

    #permissionScreen p {
      margin: 0 0 24px;
      font-size: 16px;
      line-height: 1.8;
    }

    #startButton {
      min-width: 240px;
      padding: 15px 24px;
      border-radius: 999px;
      background: #ff8a00;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.3);
    }

    #errorMessage {
      max-width: 360px;
      margin-top: 18px;
      color: #ffd6d6;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-line;
    }

    /* 撮影後プレビュー */
    #previewScreen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 18px
        max(18px, env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.92);
    }

    #previewImage {
      display: block;
      max-width: 100%;
      max-height: calc(100% - 100px);
      border-radius: 14px;
      object-fit: contain;
    }

    #previewActions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    #downloadButton,
    #closePreview {
      padding: 13px 20px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
    }

    #downloadButton {
      background: #ff8a00;
      color: #fff;
    }

    #closePreview {
      background: #fff;
      color: #333;
    }

    #status {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      max-width: 88%;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 13px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    #status.show {
      opacity: 1;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>
  <main id="app">
    <video id="camera" autoplay muted playsinline></video>

    <!-- GitHubに同じ階層で置く画像名を frame.png にしてください -->
    <img id="frame" src="frame.png" alt="ハロウィン限定フォトフレーム" />

    <div id="status"></div>

    <div id="controls" hidden>
      <button
        id="switchCamera"
        class="round-button"
        type="button"
        aria-label="カメラを切り替える"
        title="カメラ切替"
      >
        ↻
      </button>

      <button
        id="shutter"
        type="button"
        aria-label="写真を撮影する"
        title="撮影"
      ></button>

      <button
        id="helpButton"
        class="round-button"
        type="button"
        aria-label="使い方を表示する"
        title="使い方"
      >
        ?
      </button>
    </div>

    <section id="permissionScreen">
      <h1>🎃 ハロウィン限定フレーム</h1>
      <p>
        カメラの使用を許可して、<br />
        ワンちゃんと一緒に撮影しよう！
      </p>
      <button id="startButton" type="button">限定フレームで撮影する</button>
      <div id="errorMessage"></div>
    </section>

    <section id="previewScreen">
      <img id="previewImage" alt="撮影した写真" />
      <div id="previewActions">
        <button id="downloadButton" type="button">写真を保存</button>
        <button id="closePreview" type="button">撮り直す</button>
      </div>
    </section>

    <canvas id="canvas"></canvas>
  </main>

  <script>
    "use strict";

    const video = document.getElementById("camera");
    const frame = document.getElementById("frame");
    const canvas = document.getElementById("canvas");
    const controls = document.getElementById("controls");
    const permissionScreen = document.getElementById("permissionScreen");
    const startButton = document.getElementById("startButton");
    const switchCameraButton = document.getElementById("switchCamera");
    const shutterButton = document.getElementById("shutter");
    const helpButton = document.getElementById("helpButton");
    const previewScreen = document.getElementById("previewScreen");
    const previewImage = document.getElementById("previewImage");
    const downloadButton = document.getElementById("downloadButton");
    const closePreviewButton = document.getElementById("closePreview");
    const errorMessage = document.getElementById("errorMessage");
    const status = document.getElementById("status");

    let stream = null;
    let facingMode = "environment";
    let capturedDataUrl = "";

    function showStatus(message, duration = 2200) {
      status.textContent = message;
      status.classList.add("show");

      window.clearTimeout(showStatus.timer);
      showStatus.timer = window.setTimeout(() => {
        status.classList.remove("show");
      }, duration);
    }

    function stopCamera() {
      if (!stream) return;

      stream.getTracks().forEach((track) => track.stop());
      stream = null;
      video.srcObject = null;
    }

    async function startCamera() {
      errorMessage.textContent = "";
      startButton.disabled = true;
      startButton.textContent = "カメラを起動中…";

      try {
        stopCamera();

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        await video.play();

        permissionScreen.style.display = "none";
        controls.hidden = false;
        updateMirror();
        showStatus("中央の白いボタンで撮影できます");
      } catch (error) {
        console.error(error);

        let message =
          "カメラを起動できませんでした。\nSafariまたはChromeで開き、カメラの使用を許可してください。";

        if (location.protocol !== "https:" && location.hostname !== "localhost") {
          message += "\n※カメラ機能にはHTTPSが必要です。GitHub Pagesで公開してください。";
        }

        errorMessage.textContent = message;
      } finally {
        startButton.disabled = false;
        startButton.textContent = "もう一度試す";
      }
    }

    function updateMirror() {
      const isFrontCamera = facingMode === "user";
      video.style.transform = isFrontCamera ? "scaleX(-1)" : "none";
    }

    async function switchCamera() {
      facingMode = facingMode === "environment" ? "user" : "environment";

      try {
        await startCamera();
      } catch (error) {
        console.error(error);
        showStatus("カメラを切り替えられませんでした");
      }
    }

    function getCoverCrop(sourceWidth, sourceHeight, targetWidth, targetHeight) {
      const sourceRatio = sourceWidth / sourceHeight;
      const targetRatio = targetWidth / targetHeight;

      let sx = 0;
      let sy = 0;
      let sw = sourceWidth;
      let sh = sourceHeight;

      if (sourceRatio > targetRatio) {
        sw = sourceHeight * targetRatio;
        sx = (sourceWidth - sw) / 2;
      } else {
        sh = sourceWidth / targetRatio;
        sy = (sourceHeight - sh) / 2;
      }

      return { sx, sy, sw, sh };
    }

    function takePhoto() {
      if (!video.videoWidth || !video.videoHeight) {
        showStatus("カメラの準備ができていません");
        return;
      }

      const outputWidth = 1080;
      const outputHeight = 1920;

      canvas.width = outputWidth;
      canvas.height = outputHeight;

      const context = canvas.getContext("2d");
      context.clearRect(0, 0, outputWidth, outputHeight);

      const crop = getCoverCrop(
        video.videoWidth,
        video.videoHeight,
        outputWidth,
        outputHeight
      );

      context.save();

      if (facingMode === "user") {
        context.translate(outputWidth, 0);
        context.scale(-1, 1);
      }

      context.drawImage(
        video,
        crop.sx,
        crop.sy,
        crop.sw,
        crop.sh,
        0,
        0,
        outputWidth,
        outputHeight
      );

      context.restore();

      if (!frame.complete || frame.naturalWidth === 0) {
        showStatus("フレーム画像を読み込めません");
        return;
      }

      context.drawImage(frame, 0, 0, outputWidth, outputHeight);

      capturedDataUrl = canvas.toDataURL("image/jpeg", 0.94);
      previewImage.src = capturedDataUrl;
      previewScreen.style.display = "flex";
    }

    function savePhoto() {
      if (!capturedDataUrl) return;

      const link = document.createElement("a");
      const timestamp = new Date()
        .toISOString()
        .replace(/[:.]/g, "-")
        .slice(0, 19);

      link.href = capturedDataUrl;
      link.download = `stellar-pet-marche-${timestamp}.jpg`;
      document.body.appendChild(link);
      link.click();
      link.remove();

      showStatus("写真を保存しました");
    }

    function closePreview() {
      previewScreen.style.display = "none";
      previewImage.removeAttribute("src");
      capturedDataUrl = "";
    }

    function showHelp() {
      alert(
        "使い方\n\n" +
          "1. ワンちゃんを中央に合わせます。\n" +
          "2. 白い丸ボタンで撮影します。\n" +
          "3. 「写真を保存」を押します。\n" +
          "4. 保存した写真をInstagramへ投稿してください。"
      );
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      errorMessage.textContent =
        "このブラウザはカメラ機能に対応していません。SafariまたはChromeで開いてください。";
      startButton.disabled = true;
    }

    startButton.addEventListener("click", startCamera);
    switchCameraButton.addEventListener("click", switchCamera);
    shutterButton.addEventListener("click", takePhoto);
    downloadButton.addEventListener("click", savePhoto);
    closePreviewButton.addEventListener("click", closePreview);
    helpButton.addEventListener("click", showHelp);

    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
